{{ define "main" }}
  <div class="uk-container">
    <div class="contact-panel">
      <header class="contact-header">
        <h1>{{ .Title }}</h1>
      </header>
      <div class="contact-options">
        {{ range .Params.options }}
          <section class="contact-option" id="{{ .id }}">
            <div class="contact-option-body">
              {{ partial "font-awesome.html" (print "lucide/" .icon) }}
              <h2>{{ .title }}</h2>
              <p>{{ $.RenderString .description }}</p>
              <div class="contact-option-links">
                {{ range .links }}
                  <a class="contact-link" href="{{ .url }}" target="_blank" rel="noopener">
                    <span class="contact-link-text">{{ .text }}</span>
                    {{ partial "font-awesome.html" "lucide/arrow-up-right" }}
                  </a>
                {{ end }}
              </div>
            </div>
          </section>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
